x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://sin_linea:sin_linea@postgres:5432/sin_linea
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: http://localhost:3000
  APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-admin}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  LIGHT_PROCESSING_PROVIDER: ${LIGHT_PROCESSING_PROVIDER:-}
  LIGHT_PROCESSING_MODEL: ${LIGHT_PROCESSING_MODEL:-}
  AMBIGUOUS_DEDUP_PROVIDER: ${AMBIGUOUS_DEDUP_PROVIDER:-}
  AMBIGUOUS_DEDUP_MODEL: ${AMBIGUOUS_DEDUP_MODEL:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  EXA_API_KEY: ${EXA_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAIM_RESOLUTION_PROVIDER: ${CLAIM_RESOLUTION_PROVIDER:-}
  CLAIM_RESOLUTION_MODEL: ${CLAIM_RESOLUTION_MODEL:-}
  VERIFICATION_PROVIDER: ${VERIFICATION_PROVIDER:-}
  VERIFICATION_MODEL: ${VERIFICATION_MODEL:-}
  WRITING_PROVIDER: ${WRITING_PROVIDER:-}
  WRITING_MODEL: ${WRITING_MODEL:-}
  AUDITING_PROVIDER: ${AUDITING_PROVIDER:-}
  AUDITING_MODEL: ${AUDITING_MODEL:-}
  MAX_RESEARCH_QUERIES_PER_EVENT: ${MAX_RESEARCH_QUERIES_PER_EVENT:-4}
  MAX_RESEARCH_RESULTS_PER_QUERY: ${MAX_RESEARCH_RESULTS_PER_QUERY:-5}
  MAX_RESEARCH_RESULTS_PER_DOMAIN: ${MAX_RESEARCH_RESULTS_PER_DOMAIN:-3}
  MAX_VERIFICATION_CLAIMS_PER_EVENT: ${MAX_VERIFICATION_CLAIMS_PER_EVENT:-5}
  MAX_VERIFICATION_QUERIES_PER_CLAIM: ${MAX_VERIFICATION_QUERIES_PER_CLAIM:-2}
  MAX_VERIFICATION_RESULTS_PER_QUERY: ${MAX_VERIFICATION_RESULTS_PER_QUERY:-3}
  MAX_WRITING_CLAIMS_PER_EVENT: ${MAX_WRITING_CLAIMS_PER_EVENT:-40}
  MAX_WRITING_SOURCES_PER_EVENT: ${MAX_WRITING_SOURCES_PER_EVENT:-20}
  WRITING_EXCERPT_CHARS: ${WRITING_EXCERPT_CHARS:-400}
  WRITING_MAX_OUTPUT_TOKENS: ${WRITING_MAX_OUTPUT_TOKENS:-4096}
  MAX_AUDIT_REWRITE_CYCLES: ${MAX_AUDIT_REWRITE_CYCLES:-2}
  INGESTION_POLL_INTERVAL_SECONDS: ${INGESTION_POLL_INTERVAL_SECONDS:-900}
  MAX_NEW_EVENTS_PER_POLL: ${MAX_NEW_EVENTS_PER_POLL:-0}
  FEED_RELEVANCE_WEIGHT: ${FEED_RELEVANCE_WEIGHT:-1.0}
  FEED_FRESHNESS_WEIGHT: ${FEED_FRESHNESS_WEIGHT:-1.0}
  FEED_LOCALITY_WEIGHT: ${FEED_LOCALITY_WEIGHT:-1.0}
  NEARBY_WINDOW_HOURS: ${NEARBY_WINDOW_HOURS:-12}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sin_linea
      POSTGRES_PASSWORD: sin_linea
      POSTGRES_DB: sin_linea
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sin_linea -d sin_linea"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info -Q ingestion,event_detection,research,claim_resolution,verification,writing,auditing,publishing,celery
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=info
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
